```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SN Photography</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .hero-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .hero-images img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            display: block;
        }

        header {
            text-align: center;
            padding: 90px 20px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        header p {
            color: #bbb;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 28px;
            border: 1px solid white;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background: white;
            color: #111;
        }

        .section {
            text-align: center;
            padding: 70px 20px;
        }

        .section h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .section p {
            color: #aaa;
            margin-bottom: 40px;
        }

        .gallery {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 40px;
            background: #050505;
            color: #777;
        }

        @media (max-width: 700px) {
            .hero-images {
                grid-template-columns: 1fr;
            }

            .hero-images img {
                height: 350px;
            }

            h1 {
                font-size: 38px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: 400px;
            }
        }
    </style>
</head>

<body>

    <!-- Top Photos -->
    <div class="hero-images">
        <img src="IMG_1828.JPG" alt="SN Photography">
        <img src="IMG_1830.JPG" alt="SN Photography">
    </div>

    <!-- Header -->
    <header>
        <h1>SN Photography</h1>

        <p>
            Photography • Photo Editing • Creative Work
        </p>

        <a href="#gallery" class="button">
            View My Work
        </a>
    </header>

    <!-- Gallery -->
    <section class="section" id="gallery">

        <h2>My Photography</h2>

        <p>
            Beautiful moments captured through my camera.
        </p>

        <div class="gallery">

            <img src="IMG_1828.JPG" alt="SN Photography">
            <img src="IMG_1830.JPG" alt="SN Photography">

        </div>

    </section>

    <!-- Footer -->
    <footer>
        © 2026 SN Photography
    </footer>

</body>
</html>
