<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN Photo Gallery</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f7f7;
    color:#222;
}

header{
    background:#111;
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{
    margin:0;
    font-size:32px;
}

header p{
    margin:8px 0 0;
    color:#ccc;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 15px;
}

.welcome{
    text-align:center;
    margin-bottom:30px;
}

.album{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    text-align:center;
}

.album h2{
    margin-top:0;
}

.album button{
    background:#111;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

footer{
    text-align:center;
    padding:30px;
    color:#777;
}
</style>
</head>

<body>

<header>
    <h1>📸 SN Photo Gallery</h1>
    <p>Beautiful moments, preserved forever.</p>
</header>

<div class="container">

    <div class="welcome">
        <h2>မင်္ဂလာပါ ❤️</h2>
        <p>မင်းရဲ့ အမှတ်တရဓာတ်ပုံတွေကို ဒီမှာကြည့်နိုင်ပါတယ်။</p>
    </div>

    <div class="album">
        <h2>💍 Wedding Album</h2>
        <p>SN Photography</p>
        <button>View Photos</button>
    </div>

</div>

<footer>
    © 2026 SN Photography
</footer>

</body>
</html>
