```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SN Photography</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        /* TOP PHOTOS */
        .hero-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .hero-images img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            display: block;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 90px 20px;
        }

        h1 {
            font-size: 52px;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        header p {
            color: #aaa;
            font-size: 18px;
        }

        /* BUTTON */
        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 13px 30px;
            border: 1px solid white;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background: white;
            color: #111;
        }

        /* GALLERY SECTION */
        .section {
            text-align: center;
            padding: 80px 20px;
        }

        .section h2 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .section p {
            color: #999;
            margin-bottom: 40px;
        }

        /* GALLERY */
        .gallery {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.02);
            opacity: 0.85;
        }

        /* FULL SCREEN IMAGE */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            font-size: 45px;
            color: white;
            cursor: pointer;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 40px;
            background: #050505;
            color: #777;
        }

        /* PHONE */
        @media (max-width: 700px) {

            .hero-images {
                grid-template-columns: 1fr;
            }

            .hero-images img {
                height: 350px;
            }

            h1 {
                font-size: 38px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: 400px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP PHOTOS -->
    <div class="hero-images">
        <img src="IMG_1828.JPG" alt="SN Photography">
        <img src="IMG_1830.JPG" alt="SN Photography">
    </div>

    <!-- HEADER -->
    <header>
        <h1>SN Photography</h1>

        <p>
            Photography • Photo Editing • Creative Work
        </p>

        <a href="#gallery" class="button">
            View My Work
        </a>
    </header>

    <!-- GALLERY -->
    <section class="section" id="gallery">

        <h2>My Photography</h2>

        <p>
            Beautiful moments captured through my camera.
        </p>

        <div class="gallery">

            <img src="IMG_1828.JPG"
                 alt="SN Photography"
                 onclick="openImage(this.src)">

            <img src="IMG_1830.JPG"
                 alt="SN Photography"
                 onclick="openImage(this.src)">

        </div>

    </section>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">

        <span class="close" onclick="closeImage()">
            &times;
        </span>

        <img id="bigImage" src="" alt="SN Photography">

    </div>

    <!-- FOOTER -->
    <footer>
        © 2026 SN Photography
    </footer>

    <!-- JAVASCRIPT -->
    <script>

        function openImage(image) {
            document.getElementById("lightbox").style.display = "flex";
            document.getElementById("bigImage").src = image;
        }

        function closeImage() {
            document.getElementById("lightbox").style.display = "none";
        }

    </script>

</body>
</html>
```
