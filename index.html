```
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    header {
        background: #111;
        color: white;
        text-align: center;
        padding: 60px 20px;
    }

    header h1 {
        font-size: 45px;
        margin-bottom: 12px;
    }

    header p {
        font-size: 18px;
        color: #ccc;
    }

    .about {
        text-align: center;
        padding: 40px 20px;
        background: white;
    }

    .about h2 {
        font-size: 30px;
        margin-bottom: 15px;
    }

    .about p {
        color: #666;
        font-size: 17px;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        padding: 40px 25px;
    }

    .photo {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .photo img {
        width: 100%;
        height: 300px;
        object-fit: cover;
        display: block;
    }

    .photo p {
        text-align: center;
        padding: 15px;
        font-size: 16px;
    }

    footer {
        background: #111;
        color: #aaa;
        text-align: center;
        padding: 30px 20px;
    }
</style>
```

</head>

<body>

```
<header>
    <h1>SN Photography</h1>
    <p>Photography & Photo Editing</p>
</header>

<section class="about">

</section>

<section class="gallery">

    <div class="photo">

    </div>

    </div>

    </div>

</section>

<footer>
