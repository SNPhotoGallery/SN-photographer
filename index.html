<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SN Photography</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            text-align: center;
            padding: 100px 20px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        header p {
            color: #bbb;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 28px;
            border: 1px solid white;
            border-radius: 30px;
            color: white;
            text-decoration: none;
        }

        .section {
            text-align: center;
            padding: 60px 20px;
        }

        .section h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .section p {
            color: #aaa;
        }

        footer {
            text-align: center;
            padding: 40px;
            background: #050505;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>SN Photography</h1>
        <p>Photography • Photo Editing • Creative Work</p>
        <a href="#about" class="button">View My Work</a>
    </header>

    <section class="section" id="about">
        <h2>My Photography</h2>
        <p>Beautiful moments captured through my camera.</p>
    </section>

    <footer>
        © 2026 SN Photography
    </footer>

</body>
</html>
